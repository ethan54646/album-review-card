name: Patch palette extraction

on:
  push:
    paths:
      - '.github/workflows/patch-palette.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace palette extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text()
          new_func = r'''function extractPalette(image) {
            // Pick colors by actual pixel coverage, not saturation.
            // Nearby shades are grouped so broad color areas win.
            if (!image) return ['#666666', '#aaaaaa', '#222222'];

            const sample = document.createElement('canvas');
            const sctx = sample.getContext('2d', { willReadFrequently: true });
            sample.width = 80;
            sample.height = 80;
            sctx.drawImage(image, 0, 0, sample.width, sample.height);

            const { data } = sctx.getImageData(0, 0, sample.width, sample.height);
            const bins = new Map();

            for (let i = 0; i < data.length; i += 4) {
              if (data[i + 3] < 120) continue;

              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];
              const step = 24;
              const qr = clamp(Math.round(r / step) * step, 0, 255);
              const qg = clamp(Math.round(g / step) * step, 0, 255);
              const qb = clamp(Math.round(b / step) * step, 0, 255);
              const key = `${qr},${qg},${qb}`;
              bins.set(key, (bins.get(key) || 0) + 1);
            }

            const colors = Array.from(bins.entries())
              .sort((a, b) => b[1] - a[1])
              .map(([key, count]) => {
                const [r, g, b] = key.split(',').map(Number);
                return { color: rgbToHex(r, g, b), count };
              });

            const picked = [];
            for (const item of colors) {
              if (picked.length >= 3) break;
              const rgbA = hexToRgb(item.color);
              const distinct = picked.every(existing => {
                const rgbB = hexToRgb(existing);
                return Math.hypot(rgbA.r - rgbB.r, rgbA.g - rgbB.g, rgbA.b - rgbB.b) > 36;
              });
              if (distinct) picked.push(item.color);
            }

            if (picked.length === 0) return ['#666666', '#aaaaaa', '#222222'];
            if (picked.length === 1) {
              picked.push(mix(picked[0], '#ffffff', 0.32));
              picked.push(mix(picked[0], '#000000', 0.32));
            } else if (picked.length === 2) {
              picked.push(mix(picked[0], picked[1], 0.5));
            }

            return picked.slice(0, 3);
          }'''

          new_text, n = re.subn(r'function extractPalette\(image\) \{.*?\n\}', new_func, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected to replace 1 extractPalette function, replaced {n}')
          p.write_text(new_text)
          PY
      - name: Check JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          m = re.search(r'<script>(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-palette.yml
          git add index.html
          git commit -m 'Use dominant pixel coverage for cover colors'
          git push
