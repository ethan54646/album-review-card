<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>专辑乐评图片生成器</title>
  <style>
    :root{--bg:#0f1115;--panel:#171a21;--panel2:#1f2430;--text:#f3f5f7;--muted:#aeb7c2;--border:rgba(255,255,255,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#0b0d12,#131722);color:var(--text);min-height:100vh}.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 40px}h1{margin:0 0 8px;font-size:28px}.sub{color:var(--muted);margin-bottom:20px;line-height:1.5;font-size:14px}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}@media(max-width:900px){.grid{grid-template-columns:1fr}}.panel{background:rgba(23,26,33,.92);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.22)}.panel h2{margin:0 0 14px;font-size:18px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;color:#dbe3ea;font-size:14px;font-weight:600}.field input[type=text],.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px;font-size:15px;outline:none}.field textarea{min-height:72px;resize:vertical}.field input[type=file]{width:100%;font-size:14px;color:var(--muted)}.hint{color:var(--muted);font-size:12px;line-height:1.4;margin-top:5px}.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}button{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,#60a5fa,#22d3ee);color:#061018}.secondary{background:#2a3040;color:#eef4f8;border:1px solid var(--border)}.preview-wrap{display:flex;flex-direction:column;gap:14px;align-items:center}.canvas-shell{width:min(100%,640px);aspect-ratio:1/1;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:20px;display:grid;place-items:center;overflow:hidden}canvas{width:100%;height:100%;display:block;border-radius:20px}.tips{color:var(--muted);font-size:13px;line-height:1.6;width:min(100%,640px)}.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footer-note{margin-top:22px;color:#95a1af;font-size:12px;line-height:1.5}
  </style>
</head>
<body>
<div class="wrap">
  <h1>专辑乐评图片生成器</h1>
  <div class="sub">上传封面，填写专辑名、艺人和分数，立即生成一张可下载的 PNG 乐评图。<br>图片只在你的浏览器本地处理，不会上传到服务器。</div>
  <div class="grid">
    <div class="panel">
      <h2>输入信息</h2>
      <div class="field"><label for="coverInput">专辑封面</label><input id="coverInput" type="file" accept="image/*"><div class="hint">iPhone / iPad 可直接从照片中选择。</div></div>
      <div class="field"><label for="album">专辑名</label><input id="album" type="text" value="The Life of a Showgirl" placeholder="输入专辑名"></div>
      <div class="field"><label for="artist">艺人名</label><input id="artist" type="text" value="Taylor Swift" placeholder="输入艺人名"></div>
      <div class="inline">
        <div class="field"><label for="score">分数</label><input id="score" type="text" value="8.2" placeholder="例如 8.2"></div>
        <div class="field"><label for="template">模板</label><select id="template"><option value="mag">杂志大数字风</option><option value="minimal">极简黑白风</option><option value="aurora">渐变海报风</option></select></div>
      </div>
      <div class="field"><label for="caption">副标题 / 一句话短评（可选）</label><textarea id="caption" placeholder="写一句短评">A mischievous, flirty, surprisingly cohesive pop record.</textarea></div>
      <div class="btns"><button id="downloadBtn" class="primary">下载 PNG</button><button id="resetBtn" class="secondary">恢复默认示例</button></div>
      <div class="footer-note">评分可直接写「8.2」或「8.2 / 10」。不写短评也没问题。导出的是 1600×1600 高清 PNG。</div>
    </div>
    <div class="panel preview-wrap">
      <h2 style="align-self:flex-start;width:min(100%,640px)">实时预览</h2>
      <div class="canvas-shell"><canvas id="cardCanvas" width="1600" height="1600"></canvas></div>
      <div class="tips">修改左侧内容，预览会自动更新。完成后点 <strong>下载 PNG</strong>。</div>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('cardCanvas'),ctx=canvas.getContext('2d');
const coverInput=document.getElementById('coverInput'),albumInput=document.getElementById('album'),artistInput=document.getElementById('artist'),scoreInput=document.getElementById('score'),templateInput=document.getElementById('template'),captionInput=document.getElementById('caption'),downloadBtn=document.getElementById('downloadBtn'),resetBtn=document.getElementById('resetBtn');
let coverImage=null;
function roundedRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawCover(image,x,y,size,r=36){ctx.save();roundedRect(ctx,x,y,size,size,r);ctx.clip();if(image){const s=Math.max(size/image.width,size/image.height),dw=image.width*s,dh=image.height*s;ctx.drawImage(image,x+(size-dw)/2,y+(size-dh)/2,dw,dh)}else{const g=ctx.createLinearGradient(x,y,x+size,y+size);g.addColorStop(0,'#2e3a59');g.addColorStop(1,'#101826');ctx.fillStyle=g;ctx.fillRect(x,y,size,size);ctx.fillStyle='rgba(255,255,255,.12)';ctx.font='700 72px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';ctx.fillText('NO COVER',x+size/2,y+size/2+20)}ctx.restore()}
function fitText(text,maxWidth,startSize,weight='700'){let size=startSize;while(size>24){ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,sans-serif`;if(ctx.measureText(text).width<=maxWidth)return size;size-=2}return size}
function wrapText(text,x,y,maxWidth,lineHeight,maxLines,align='left'){if(!text.trim())return;const words=text.split(/\s+/),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);const final=lines.slice(0,maxLines);if(lines.length>maxLines&&final.length){let last=final[final.length-1];while(ctx.measureText(last+'…').width>maxWidth&&last.length)last=last.slice(0,-1);final[final.length-1]=last+'…'}ctx.textAlign=align;final.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight))}
function drawMag(album,artist,score,caption){const bg=ctx.createLinearGradient(0,0,1600,1600);bg.addColorStop(0,'#0a0d14');bg.addColorStop(1,'#171d2d');ctx.fillStyle=bg;ctx.fillRect(0,0,1600,1600);ctx.fillStyle='rgba(255,255,255,.06)';roundedRect(ctx,80,80,1440,1440,48);ctx.fill();drawCover(coverImage,130,130,680,42);ctx.textAlign='left';ctx.fillStyle='#f8fbff';ctx.font='800 64px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('ALBUM REVIEW',885,182);ctx.fillStyle='rgba(255,255,255,.68)';ctx.font='700 26px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('SCORE',895,290);ctx.fillStyle='#fff';ctx.font='800 250px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(score,885,505);ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='700 32px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('/ 10',1230,505);const albumSize=fitText(album.toUpperCase(),1240,72,'800');ctx.fillStyle='#fff';ctx.font=`800 ${albumSize}px -apple-system,BlinkMacSystemFont,sans-serif`;wrapText(album.toUpperCase(),130,950,1320,albumSize+8,2);ctx.fillStyle='rgba(255,255,255,.74)';ctx.font='700 42px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(artist,130,1090);if(caption.trim()){ctx.fillStyle='rgba(255,255,255,.92)';ctx.font='500 38px -apple-system,BlinkMacSystemFont,sans-serif';wrapText(caption,130,1185,1260,54,4)}ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(130,1430);ctx.lineTo(1470,1430);ctx.stroke()}
function drawMinimal(album,artist,score,caption){ctx.fillStyle='#f5f5f0';ctx.fillRect(0,0,1600,1600);ctx.fillStyle='#111';ctx.fillRect(0,0,1600,170);ctx.fillStyle='#fff';ctx.font='800 54px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('REVIEW',94,108);drawCover(coverImage,96,260,620,18);ctx.fillStyle='#111';ctx.font='800 340px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(score,820,560);ctx.font='700 28px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('/10',1260,552);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(820,620);ctx.lineTo(1460,620);ctx.stroke();const albumSize=fitText(album,1360,82,'800');ctx.font=`800 ${albumSize}px -apple-system,BlinkMacSystemFont,sans-serif`;wrapText(album,96,980,1360,albumSize+12,2);ctx.fillStyle='#333';ctx.font='700 44px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(artist,96,1110);if(caption.trim()){ctx.fillStyle='#222';ctx.font='500 38px -apple-system,BlinkMacSystemFont,sans-serif';wrapText(caption,96,1210,1360,54,4)}}
function drawAurora(album,artist,score,caption){const bg=ctx.createLinearGradient(0,0,1600,1600);bg.addColorStop(0,'#1e1b4b');bg.addColorStop(.5,'#0f172a');bg.addColorStop(1,'#111827');ctx.fillStyle=bg;ctx.fillRect(0,0,1600,1600);const o1=ctx.createRadialGradient(280,220,0,280,220,480);o1.addColorStop(0,'rgba(99,102,241,.95)');o1.addColorStop(1,'rgba(99,102,241,0)');ctx.fillStyle=o1;ctx.fillRect(0,0,1600,1600);const o2=ctx.createRadialGradient(1300,350,0,1300,350,420);o2.addColorStop(0,'rgba(34,211,238,.75)');o2.addColorStop(1,'rgba(34,211,238,0)');ctx.fillStyle=o2;ctx.fillRect(0,0,1600,1600);const o3=ctx.createRadialGradient(1180,1280,0,1180,1280,500);o3.addColorStop(0,'rgba(244,114,182,.65)');o3.addColorStop(1,'rgba(244,114,182,0)');ctx.fillStyle=o3;ctx.fillRect(0,0,1600,1600);ctx.fillStyle='rgba(255,255,255,.08)';roundedRect(ctx,90,90,1420,1420,56);ctx.fill();drawCover(coverImage,110,110,560,44);ctx.fillStyle='#fff';ctx.font='700 34px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('LISTENING NOTES',720,166);ctx.font='800 230px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(score,708,430);ctx.font='700 30px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('/10',1080,422);const albumSize=fitText(album,770,72,'800');ctx.font=`800 ${albumSize}px -apple-system,BlinkMacSystemFont,sans-serif`;wrapText(album,110,790,1380,albumSize+12,2);ctx.fillStyle='rgba(255,255,255,.82)';ctx.font='700 42px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(artist,110,915);if(caption.trim()){ctx.fillStyle='rgba(255,255,255,.96)';ctx.font='500 38px -apple-system,BlinkMacSystemFont,sans-serif';wrapText(caption,110,1030,1300,54,5)}}
function draw(){const album=(albumInput.value||'Album Title').trim(),artist=(artistInput.value||'Artist Name').trim(),score=(scoreInput.value||'8.0').trim(),caption=(captionInput.value||'').trim(),tpl=templateInput.value;ctx.clearRect(0,0,1600,1600);if(tpl==='minimal')drawMinimal(album,artist,score,caption);else if(tpl==='aurora')drawAurora(album,artist,score,caption);else drawMag(album,artist,score,caption)}
coverInput.addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file){coverImage=null;draw();return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{coverImage=img;draw()};img.src=reader.result};reader.readAsDataURL(file)});
[albumInput,artistInput,scoreInput,templateInput,captionInput].forEach(el=>{el.addEventListener('input',draw);el.addEventListener('change',draw)});
downloadBtn.addEventListener('click',()=>{draw();const link=document.createElement('a'),safeAlbum=(albumInput.value||'album-review').trim().replace(/[\\/:*?"<>|]+/g,'-');link.download=`${safeAlbum||'album-review'}.png`;link.href=canvas.toDataURL('image/png');link.click()});
resetBtn.addEventListener('click',()=>{albumInput.value='The Life of a Showgirl';artistInput.value='Taylor Swift';scoreInput.value='8.2';templateInput.value='mag';captionInput.value='A mischievous, flirty, surprisingly cohesive pop record.';coverInput.value='';coverImage=null;draw()});
draw();
</script>
</body>
</html>
