<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>专辑乐评图片生成器</title><style>:root{--p:#171a21;--p2:#1f2430;--t:#f3f5f7;--m:#aeb7c2;--b:rgba(255,255,255,.08)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#0b0d12,#131722);color:var(--t);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:24px 16px 40px}h1{margin:0 0 8px;font-size:28px}.sub{color:var(--m);margin-bottom:20px;line-height:1.5;font-size:14px}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}@media(max-width:900px){.grid{grid-template-columns:1fr}}.panel{background:rgba(23,26,33,.94);border:1px solid var(--b);border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.22)}.panel h2{margin:0 0 14px;font-size:18px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;color:#dbe3ea;font-size:14px;font-weight:650}.field input[type=text],.field select,.field textarea{width:100%;border:1px solid var(--b);background:var(--p2);color:var(--t);border-radius:12px;padding:12px;font-size:16px;outline:none}.field textarea{min-height:72px;resize:vertical}.field input[type=file]{width:100%;font-size:14px;color:var(--m)}.hint,.note,.tips{color:var(--m);font-size:12px;line-height:1.55}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}button{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:750;cursor:pointer}.primary{background:linear-gradient(135deg,#60a5fa,#22d3ee);color:#061018}.secondary{background:#2a3040;color:#eef4f8;border:1px solid var(--b)}.preview{display:flex;flex-direction:column;gap:14px;align-items:center}.shell{width:min(100%,640px);aspect-ratio:1;background:rgba(255,255,255,.03);border:1px solid var(--b);border-radius:20px;overflow:hidden}.shell canvas{width:100%;height:100%;display:block}.tips{width:min(100%,640px);font-size:13px}.note{margin-top:18px}</style></head><body><div class="wrap"><h1>专辑乐评图片生成器</h1><div class="sub">上传封面，填写专辑名、艺人和分数，立即生成 PNG。图片只在你的浏览器本地处理，不会上传到服务器。</div><div class="grid"><div class="panel"><h2>输入信息</h2><div class="field"><label>专辑封面</label><input id="cover" type="file" accept="image/*"><div class="hint">iPhone / iPad 可直接从照片中选择。</div></div><div class="field"><label>专辑名</label><input id="album" type="text" value="The Life of a Showgirl"></div><div class="field"><label>艺人名</label><input id="artist" type="text" value="Taylor Swift"></div><div class="row"><div class="field"><label>分数</label><input id="score" type="text" value="8.2"></div><div class="field"><label>模板</label><select id="template"><option value="mag">杂志大数字风</option><option value="minimal">极简黑白风</option><option value="aurora">渐变海报风</option></select></div></div><div class="field"><label>副标题 / 一句话短评（可选）</label><textarea id="caption">A mischievous, flirty, surprisingly cohesive pop record.</textarea></div><div class="btns"><button id="share" class="primary">保存到相册 / 分享</button><button id="download" class="secondary">下载到文件</button><button id="reset" class="secondary">恢复默认示例</button></div><div class="note">iPhone：点「保存到相册 / 分享」→ 系统分享面板 →「存储图像」，图片会进入“照片”App。网页受 iOS 权限限制，不能在你不确认的情况下直接写进相册。导出尺寸为 1600×1600。</div></div><div class="panel preview"><h2 style="align-self:flex-start;width:min(100%,640px)">实时预览</h2><div class="shell"><canvas id="cv" width="1600" height="1600"></canvas></div><div class="tips">修改内容会自动更新。手机上优先使用「保存到相册 / 分享」。</div></div></div></div><script>const $=id=>document.getElementById(id),cv=$('cv'),c=cv.getContext('2d'),cover=$('cover'),album=$('album'),artist=$('artist'),score=$('score'),template=$('template'),caption=$('caption');let img=null;function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}function dc(x,y,s,r=36){c.save();rr(x,y,s,s,r);c.clip();if(img){let k=Math.max(s/img.width,s/img.height),w=img.width*k,h=img.height*k;c.drawImage(img,x+(s-w)/2,y+(s-h)/2,w,h)}else{let g=c.createLinearGradient(x,y,x+s,y+s);g.addColorStop(0,'#2e3a59');g.addColorStop(1,'#101826');c.fillStyle=g;c.fillRect(x,y,s,s);c.fillStyle='rgba(255,255,255,.12)';c.font='700 72px -apple-system,sans-serif';c.textAlign='center';c.fillText('NO COVER',x+s/2,y+s/2+20)}c.restore()}function fs(t,m,s,w='700'){for(;s>24;s-=2){c.font=`${w} ${s}px -apple-system,sans-serif`;if(c.measureText(t).width<=m)return s}return s}function wt(t,x,y,m,lh,n){if(!t.trim())return;let ws=t.split(/\s+/),ls=[],l='';for(let w of ws){let q=l?l+' '+w:w;if(c.measureText(q).width>m&&l){ls.push(l);l=w}else l=q}if(l)ls.push(l);ls.slice(0,n).forEach((v,i)=>c.fillText(v,x,y+i*lh))}function mag(a,r,s,q){let g=c.createLinearGradient(0,0,1600,1600);g.addColorStop(0,'#0a0d14');g.addColorStop(1,'#171d2d');c.fillStyle=g;c.fillRect(0,0,1600,1600);c.fillStyle='rgba(255,255,255,.06)';rr(80,80,1440,1440,48);c.fill();dc(130,130,680,42);c.textAlign='left';c.fillStyle='#fff';c.font='800 64px -apple-system,sans-serif';c.fillText('ALBUM REVIEW',885,182);c.fillStyle='rgba(255,255,255,.68)';c.font='700 26px -apple-system,sans-serif';c.fillText('SCORE',895,290);c.fillStyle='#fff';c.font='800 250px -apple-system,sans-serif';c.fillText(s,885,505);c.fillStyle='rgba(255,255,255,.8)';c.font='700 32px -apple-system,sans-serif';c.fillText('/ 10',1230,505);let z=fs(a.toUpperCase(),1240,72,'800');c.fillStyle='#fff';c.font=`800 ${z}px -apple-system,sans-serif`;wt(a.toUpperCase(),130,950,1320,z+8,2);c.fillStyle='rgba(255,255,255,.74)';c.font='700 42px -apple-system,sans-serif';c.fillText(r,130,1090);if(q){c.fillStyle='rgba(255,255,255,.92)';c.font='500 38px -apple-system,sans-serif';wt(q,130,1185,1260,54,4)}}function minimal(a,r,s,q){c.fillStyle='#f5f5f0';c.fillRect(0,0,1600,1600);c.fillStyle='#111';c.fillRect(0,0,1600,170);c.fillStyle='#fff';c.font='800 54px -apple-system,sans-serif';c.fillText('REVIEW',94,108);dc(96,260,620,18);c.fillStyle='#111';c.font='800 340px -apple-system,sans-serif';c.fillText(s,820,560);c.font='700 28px -apple-system,sans-serif';c.fillText('/10',1260,552);let z=fs(a,1360,82,'800');c.font=`800 ${z}px -apple-system,sans-serif`;wt(a,96,980,1360,z+12,2);c.fillStyle='#333';c.font='700 44px -apple-system,sans-serif';c.fillText(r,96,1110);if(q){c.fillStyle='#222';c.font='500 38px -apple-system,sans-serif';wt(q,96,1210,1360,54,4)}}function aurora(a,r,s,q){let g=c.createLinearGradient(0,0,1600,1600);g.addColorStop(0,'#1e1b4b');g.addColorStop(.5,'#0f172a');g.addColorStop(1,'#111827');c.fillStyle=g;c.fillRect(0,0,1600,1600);for(let [x,y,rad,col] of [[280,220,480,'99,102,241,.95'],[1300,350,420,'34,211,238,.75'],[1180,1280,500,'244,114,182,.65']]){let o=c.createRadialGradient(x,y,0,x,y,rad);o.addColorStop(0,`rgba(${col})`);o.addColorStop(1,`rgba(${col.split(',').slice(0,3).join(',')},0)`);c.fillStyle=o;c.fillRect(0,0,1600,1600)}c.fillStyle='rgba(255,255,255,.08)';rr(90,90,1420,1420,56);c.fill();dc(110,110,560,44);c.fillStyle='#fff';c.font='700 34px -apple-system,sans-serif';c.fillText('LISTENING NOTES',720,166);c.font='800 230px -apple-system,sans-serif';c.fillText(s,708,430);c.font='700 30px -apple-system,sans-serif';c.fillText('/10',1080,422);let z=fs(a,770,72,'800');c.font=`800 ${z}px -apple-system,sans-serif`;wt(a,110,790,1380,z+12,2);c.fillStyle='rgba(255,255,255,.82)';c.font='700 42px -apple-system,sans-serif';c.fillText(r,110,915);if(q){c.fillStyle='rgba(255,255,255,.96)';c.font='500 38px -apple-system,sans-serif';wt(q,110,1030,1300,54,5)}}function draw(){let a=(album.value||'Album Title').trim(),r=(artist.value||'Artist Name').trim(),s=(score.value||'8.0').trim(),q=(caption.value||'').trim();c.clearRect(0,0,1600,1600);template.value==='minimal'?minimal(a,r,s,q):template.value==='aurora'?aurora(a,r,s,q):mag(a,r,s,q)}function name(){return((album.value||'album-review').trim().replace(/[\\/:*?"<>|]+/g,'-')||'album-review')+'.png'}function blob(){return new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(Error('PNG failed')),'image/png'))}cover.onchange=e=>{let f=e.target.files&&e.target.files[0];if(!f){img=null;draw();return}let rd=new FileReader;rd.onload=()=>{let i=new Image;i.onload=()=>{img=i;draw()};i.src=rd.result};rd.readAsDataURL(f)};[album,artist,score,template,caption].forEach(e=>{e.oninput=draw;e.onchange=draw});$('share').onclick=async()=>{draw();try{let b=await blob(),f=new File([b],name(),{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({files:[f],title:album.value||'Album Review'});return}let u=URL.createObjectURL(b),w=window.open(u,'_blank');if(!w)location.href=u;setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){if(e&&e.name==='AbortError')return;alert('无法调出系统分享面板，请使用「下载到文件」，或在生成图上长按保存。')}};$('download').onclick=()=>{draw();let a=document.createElement('a');a.download=name();a.href=cv.toDataURL('image/png');a.click()};$('reset').onclick=()=>{album.value='The Life of a Showgirl';artist.value='Taylor Swift';score.value='8.2';template.value='mag';caption.value='A mischievous, flirty, surprisingly cohesive pop record.';cover.value='';img=null;draw()};draw();</script></body></html>
