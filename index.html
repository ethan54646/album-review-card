<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>专辑乐评图片生成器</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: rgba(23, 26, 33, 0.92);
      --panel2: #1f2430;
      --text: #f3f5f7;
      --muted: #aeb7c2;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #0b0d12, #131722);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { color: var(--muted); margin-bottom: 20px; line-height: 1.55; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 360px minmax(0,1fr); gap: 20px; align-items: start; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
    }
    .panel h2 { margin: 0 0 14px; font-size: 18px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      margin-bottom: 7px;
      color: #dbe3ea;
      font-size: 14px;
      font-weight: 600;
    }
    .field input[type="text"],
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }
    .field textarea { min-height: 72px; resize: vertical; }
    .field input[type="file"] { width: 100%; font-size: 14px; color: var(--muted); }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 5px; }
    .inline { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: linear-gradient(135deg, #60a5fa, #22d3ee); color: #061018; }
    .secondary { background: #2a3040; color: #eef4f8; border: 1px solid var(--border); }
    .tertiary { background: #141926; color: #eef4f8; border: 1px solid var(--border); }
    .footer-note { margin-top: 18px; color: #95a1af; font-size: 12px; line-height: 1.55; }
    .preview-wrap { display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .canvas-shell {
      width: min(100%, 640px);
      aspect-ratio: 1 / 1;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; border-radius: 20px; }
    .tips { color: var(--muted); font-size: 13px; line-height: 1.6; width: min(100%, 640px); }
  </style>
</head>
<body>
<div class="wrap">
  <h1>专辑乐评图片生成器</h1>
  <div class="sub">上传封面，填写专辑名、艺人、发行年份和分数，立即生成一张可下载的 PNG 乐评图。<br>支持自动吸取封面主色生成渐变海报风；图片只在你的浏览器本地处理，不会上传到服务器。</div>

  <div class="grid">
    <div class="panel">
      <h2>输入信息</h2>
      <div class="field">
        <label for="coverInput">专辑封面</label>
        <input id="coverInput" type="file" accept="image/*" />
        <div class="hint">iPhone / iPad 可直接从照片中选择。</div>
      </div>
      <div class="field">
        <label for="album">专辑名</label>
        <input id="album" type="text" value="The Life of a Showgirl" placeholder="输入专辑名" />
      </div>
      <div class="field">
        <label for="artist">艺人名</label>
        <input id="artist" type="text" value="Taylor Swift" placeholder="输入艺人名" />
      </div>
      <div class="field">
        <label for="year">发行年份</label>
        <input id="year" type="text" value="2025" placeholder="例如 2025" inputmode="numeric" />
      </div>
      <div class="inline">
        <div class="field">
          <label for="score">分数</label>
          <input id="score" type="text" value="8.2" placeholder="例如 8.2" />
        </div>
        <div class="field">
          <label for="template">模板</label>
          <select id="template">
            <option value="mag">杂志大数字风</option>
            <option value="minimal">极简黑白风</option>
            <option value="aurora">渐变海报风（自动取色）</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="caption">副标题 / 一句话短评（可选）</label>
        <textarea id="caption" placeholder="写一句短评">A mischievous, flirty, surprisingly cohesive pop record.</textarea>
      </div>
      <div class="btns">
        <button id="shareBtn" class="primary">保存到相册 / 分享</button>
        <button id="downloadBtn" class="secondary">下载到文件</button>
        <button id="resetBtn" class="tertiary">恢复默认示例</button>
      </div>
      <div class="footer-note">
        评分可直接写「8.2」或「8.2 / 10」。<br>
        在 iPhone 上推荐用「保存到相册 / 分享」，然后点系统菜单里的“存储图像”。<br>
        导出的是 1600×1600 高清 PNG。
      </div>
    </div>

    <div class="panel preview-wrap">
      <h2 style="align-self:flex-start;width:min(100%,640px)">实时预览</h2>
      <div class="canvas-shell"><canvas id="cardCanvas" width="1600" height="1600"></canvas></div>
      <div class="tips">修改左侧内容，预览会自动更新。渐变海报风会自动提取封面主色。</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('cardCanvas');
const ctx = canvas.getContext('2d');
const coverInput = document.getElementById('coverInput');
const albumInput = document.getElementById('album');
const artistInput = document.getElementById('artist');
const yearInput = document.getElementById('year');
const scoreInput = document.getElementById('score');
const templateInput = document.getElementById('template');
const captionInput = document.getElementById('caption');
const shareBtn = document.getElementById('shareBtn');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');

let coverImage = null;
let palette = ['#4f46e5', '#06b6d4', '#ec4899'];

function roundedRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawCover(image, x, y, size, radius = 36) {
  ctx.save();
  roundedRect(ctx, x, y, size, size, radius);
  ctx.clip();
  if (image) {
    const scale = Math.max(size / image.width, size / image.height);
    const dw = image.width * scale;
    const dh = image.height * scale;
    ctx.drawImage(image, x + (size - dw) / 2, y + (size - dh) / 2, dw, dh);
  } else {
    const g = ctx.createLinearGradient(x, y, x + size, y + size);
    g.addColorStop(0, '#2e3a59');
    g.addColorStop(1, '#101826');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, size, size);
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.font = '700 72px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('NO COVER', x + size / 2, y + size / 2 + 20);
  }
  ctx.restore();
}

function fitText(text, maxWidth, startSize, weight = '700') {
  let size = startSize;
  while (size > 24) {
    ctx.font = `${weight} ${size}px -apple-system,BlinkMacSystemFont,sans-serif`;
    if (ctx.measureText(text).width <= maxWidth) return size;
    size -= 2;
  }
  return size;
}

function getWrappedLines(text, maxWidth) {
  if (!text.trim()) return [];
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function wrapText(text, x, y, maxWidth, lineHeight, maxLines, align = 'left') {
  const lines = getWrappedLines(text, maxWidth);
  const final = lines.slice(0, maxLines);
  if (lines.length > maxLines && final.length) {
    let last = final[final.length - 1];
    while (ctx.measureText(last + '…').width > maxWidth && last.length) {
      last = last.slice(0, -1);
    }
    final[final.length - 1] = last + '…';
  }
  ctx.textAlign = align;
  final.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
}

function drawFittedReview(text, x, top, maxWidth, bottom) {
  let fontSize = 38;
  const minFontSize = 28;
  let lines = [];
  let lineHeight = 52;
  let maxLines = 1;

  while (fontSize >= minFontSize) {
    ctx.font = `500 ${fontSize}px -apple-system,BlinkMacSystemFont,sans-serif`;
    lineHeight = Math.round(fontSize * 1.38);
    lines = getWrappedLines(text, maxWidth);
    maxLines = Math.max(1, Math.floor((bottom - top) / lineHeight) + 1);
    if (lines.length <= maxLines) break;
    fontSize -= 2;
  }

  ctx.font = `500 ${Math.max(fontSize, minFontSize)}px -apple-system,BlinkMacSystemFont,sans-serif`;
  lineHeight = Math.round(Math.max(fontSize, minFontSize) * 1.38);
  lines = getWrappedLines(text, maxWidth);
  maxLines = Math.max(1, Math.floor((bottom - top) / lineHeight) + 1);

  const final = lines.slice(0, maxLines);
  if (lines.length > maxLines && final.length) {
    let last = final[final.length - 1];
    while (ctx.measureText(last + '…').width > maxWidth && last.length) {
      last = last.slice(0, -1);
    }
    final[final.length - 1] = last + '…';
  }

  ctx.textAlign = 'left';
  final.forEach((line, i) => ctx.fillText(line, x, top + i * lineHeight));
}

function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}

function hexToRgb(hex) {
  const s = hex.replace('#', '');
  return {
    r: parseInt(s.substring(0, 2), 16),
    g: parseInt(s.substring(2, 4), 16),
    b: parseInt(s.substring(4, 6), 16)
  };
}

function luminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function mix(hexA, hexB, t) {
  const a = hexToRgb(hexA);
  const b = hexToRgb(hexB);
  return rgbToHex(a.r + (b.r - a.r) * t, a.g + (b.g - a.g) * t, a.b + (b.b - a.b) * t);
}

function withAlpha(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

function extractPalette(image) {
  if (!image) return ['#4f46e5', '#06b6d4', '#ec4899'];
  const sample = document.createElement('canvas');
  const sctx = sample.getContext('2d', { willReadFrequently: true });
  sample.width = 60;
  sample.height = 60;
  sctx.drawImage(image, 0, 0, sample.width, sample.height);
  const { data } = sctx.getImageData(0, 0, sample.width, sample.height);
  const bins = new Map();
  for (let i = 0; i < data.length; i += 4) {
    const a = data[i + 3];
    if (a < 120) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const sat = max === 0 ? 0 : (max - min) / max;
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    if (lum < 18 || lum > 245) continue;
    if (sat < 0.12) continue;
    const qr = Math.round(r / 32) * 32;
    const qg = Math.round(g / 32) * 32;
    const qb = Math.round(b / 32) * 32;
    const key = `${qr},${qg},${qb}`;
    bins.set(key, (bins.get(key) || 0) + 1 + sat * 2);
  }
  let colors = Array.from(bins.entries())
    .sort((a, b) => b[1] - a[1])
    .map(([key]) => {
      const [r, g, b] = key.split(',').map(Number);
      return rgbToHex(r, g, b);
    });

  const filtered = [];
  for (const color of colors) {
    if (filtered.length >= 3) break;
    const keep = filtered.every(existing => {
      const a = hexToRgb(color);
      const b = hexToRgb(existing);
      const dist = Math.sqrt((a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2);
      return dist > 70;
    });
    if (keep) filtered.push(color);
  }

  while (filtered.length < 3) {
    if (filtered.length === 0) filtered.push('#4f46e5');
    else if (filtered.length === 1) filtered.push(mix(filtered[0], '#06b6d4', 0.5));
    else filtered.push(mix(filtered[0], '#ec4899', 0.6));
  }

  filtered.sort((a, b) => luminance(a) - luminance(b));
  return filtered;
}

function drawMag(album, artist, year, score, caption) {
  const bg = ctx.createLinearGradient(0, 0, 1600, 1600);
  bg.addColorStop(0, '#0a0d14');
  bg.addColorStop(1, '#171d2d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1600, 1600);

  ctx.fillStyle = 'rgba(255,255,255,.06)';
  roundedRect(ctx, 80, 80, 1440, 1440, 48);
  ctx.fill();

  drawCover(coverImage, 130, 130, 680, 42);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#f8fbff';
  ctx.font = '800 64px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillText('ALBUM REVIEW', 885, 182);

  ctx.fillStyle = 'rgba(255,255,255,.68)';
  ctx.font = '700 26px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillText('SCORE', 895, 290);

  ctx.fillStyle = '#fff';
  ctx.font = '800 250px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillText(score, 885, 505);

  const albumSize = fitText(album.toUpperCase(), 1240, 72, '800');
  ctx.fillStyle = '#fff';
  ctx.font = `800 ${albumSize}px -apple-system,BlinkMacSystemFont,sans-serif`;
  wrapText(album.toUpperCase(), 130, 950, 1320, albumSize + 8, 2);

  ctx.fillStyle = 'rgba(255,255,255,.74)';
  ctx.font = '700 42px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillText([year, artist].filter(Boolean).join('  '), 130, 1090);

  if (caption.trim()) {
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.font = '500 38px -apple-system,BlinkMacSystemFont,sans-serif';
    wrapText(caption, 130, 1185, 1260, 54, 4);
  }

  ctx.strokeStyle = 'rgba(255,255,255,.14)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(130, 1430);
  ctx.lineTo(1470, 1430);
  ctx.stroke();
}

function drawMinimal(album, artist, year, score, caption) {
  ctx.fillStyle = '#f5f5f0';
  ctx.fillRect(0, 0, 1600, 1600);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, 1600, 170);
  ctx.fillStyle = '#fff';
  ctx.font = '800 54px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillText('REVIEW', 94, 108);

  drawCover(coverImage, 96, 260, 620, 18);

  ctx.fillStyle = '#111';
  ctx.font = '800 340px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillText(score, 820, 560);

  ctx.strokeStyle = '#111';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(820, 620);
  ctx.lineTo(1460, 620);
  ctx.stroke();

  const albumSize = fitText(album, 1360, 82, '800');
  ctx.font = `800 ${albumSize}px -apple-system,BlinkMacSystemFont,sans-serif`;
  wrapText(album, 96, 980, 1360, albumSize + 12, 2);

  ctx.fillStyle = '#333';
  ctx.font = '700 44px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillText([year, artist].filter(Boolean).join('  '), 96, 1110);

  if (caption.trim()) {
    ctx.fillStyle = '#222';
    ctx.font = '500 38px -apple-system,BlinkMacSystemFont,sans-serif';
    wrapText(caption, 96, 1210, 1360, 54, 4);
  }
}

function drawAurora(album, artist, year, score, caption) {
  const c1 = palette[0] || '#4338ca';
  const c2 = palette[1] || '#06b6d4';
  const c3 = palette[2] || '#ec4899';
  const bgDark = mix(c1, '#08111f', 0.78);
  const bgDark2 = mix(c2, '#050816', 0.86);

  const bg = ctx.createLinearGradient(0, 0, 1600, 1600);
  bg.addColorStop(0, bgDark);
  bg.addColorStop(0.45, bgDark2);
  bg.addColorStop(1, mix(c3, '#0b1022', 0.82));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1600, 1600);

  const orbs = [
    { x: 260, y: 220, r: 520, color: c1, alpha: 0.70 },
    { x: 1320, y: 360, r: 420, color: c2, alpha: 0.62 },
    { x: 1130, y: 1280, r: 520, color: c3, alpha: 0.58 },
    { x: 420, y: 1180, r: 360, color: mix(c1, c2, 0.45), alpha: 0.28 }
  ];
  orbs.forEach(o => {
    const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
    g.addColorStop(0, withAlpha(o.color, o.alpha));
    g.addColorStop(1, withAlpha(o.color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1600, 1600);
  });

  ctx.fillStyle = 'rgba(255,255,255,.08)';
  roundedRect(ctx, 90, 90, 1420, 1420, 56);
  ctx.fill();

  drawCover(coverImage, 120, 120, 500, 38);

  const circleX = 1180;
  const circleY = 380;
  const circleR = 215;
  const ring = ctx.createLinearGradient(circleX - circleR, circleY - circleR, circleX + circleR, circleY + circleR);
  ring.addColorStop(0, withAlpha(mix(c1, '#ffffff', 0.18), 0.9));
  ring.addColorStop(1, withAlpha(mix(c2, '#ffffff', 0.22), 0.95));
  ctx.strokeStyle = ring;
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.beginPath();
  ctx.arc(circleX, circleY, circleR - 12, 0, Math.PI * 2);
  ctx.fill();

  const scoreSize = fitText(score, 260, 138, '800');
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `800 ${scoreSize}px -apple-system,BlinkMacSystemFont,sans-serif`;
  ctx.fillText(score, circleX, circleY - 10);
  ctx.textBaseline = 'alphabetic';

  const titleSize = fitText(album, 1240, 72, '800');
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = `800 ${titleSize}px -apple-system,BlinkMacSystemFont,sans-serif`;
  wrapText(album, 120, 770, 1280, titleSize + 10, 2);

  const titleLines = Math.min(2, (() => {
    const words = album.split(/\s+/); let line=''; let count=0;
    ctx.font = `800 ${titleSize}px -apple-system,BlinkMacSystemFont,sans-serif`;
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > 1280 && line) { count++; line = word; }
      else { line = test; }
    }
    if (line) count++;
    return count;
  })());

  const artistY = 770 + titleLines * (titleSize + 10) - 6;
  ctx.fillStyle = 'rgba(255,255,255,.82)';
  ctx.font = '700 40px -apple-system,BlinkMacSystemFont,sans-serif';
  ctx.fillText([year, artist].filter(Boolean).join('          '), 120, artistY + 18);

  if (caption.trim()) {
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    const captionTop = artistY + 92;
    const captionBottom = 1435;
    drawFittedReview(caption, 120, captionTop, 1280, captionBottom);
  }
}

function draw() {
  const album = (albumInput.value || 'Album Title').trim();
  const artist = (artistInput.value || 'Artist Name').trim();
  const year = (yearInput.value || '').trim();
  const score = (scoreInput.value || '8.0').trim().replace(/\s*\/\s*10$/i, '');
  const caption = (captionInput.value || '').trim();
  const tpl = templateInput.value;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (tpl === 'minimal') drawMinimal(album, artist, year, score, caption);
  else if (tpl === 'aurora') drawAurora(album, artist, year, score, caption);
  else drawMag(album, artist, year, score, caption);
}

function fileNameBase() {
  return (albumInput.value || 'album-review').trim().replace(/[\\/:*?"<>|]+/g, '-');
}

function canvasBlob() {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

coverInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) {
    coverImage = null;
    palette = ['#4f46e5', '#06b6d4', '#ec4899'];
    draw();
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      coverImage = img;
      palette = extractPalette(img);
      draw();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

[albumInput, artistInput, yearInput, scoreInput, templateInput, captionInput].forEach(el => {
  el.addEventListener('input', draw);
  el.addEventListener('change', draw);
});

shareBtn.addEventListener('click', async () => {
  draw();
  const blob = await canvasBlob();
  const name = `${fileNameBase() || 'album-review'}.png`;
  const file = new File([blob], name, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
    try {
      await navigator.share({ files: [file], title: name });
      return;
    } catch (e) {}
  }
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 5000);
});

downloadBtn.addEventListener('click', () => {
  draw();
  const link = document.createElement('a');
  link.download = `${fileNameBase() || 'album-review'}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

resetBtn.addEventListener('click', () => {
  albumInput.value = 'The Life of a Showgirl';
  artistInput.value = 'Taylor Swift';
  yearInput.value = '2025';
  scoreInput.value = '8.2';
  templateInput.value = 'aurora';
  captionInput.value = 'A mischievous, flirty, surprisingly cohesive pop record.';
  coverInput.value = '';
  coverImage = null;
  palette = ['#4f46e5', '#06b6d4', '#ec4899'];
  draw();
});

templateInput.value = 'aurora';
draw();
</script>
</body>
</html>
